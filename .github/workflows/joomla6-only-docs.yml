name: Joomla 6-only docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/joomla6-only-docs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove Joomla 4/5 support claims
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Target Joomla 4, 5 and 6 where technically possible.': 'Target Joomla 6 only. Joomla 4 and Joomla 5 are not supported.',
              '13. verify Joomla 4/5/6, desktop/tablet/smartphone, light/dark and accessibility.': '13. verify Joomla 6.1.3, desktop/tablet/smartphone, light/dark and accessibility.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: make Draw Joomla 6 only'
          git push origin HEAD:main
