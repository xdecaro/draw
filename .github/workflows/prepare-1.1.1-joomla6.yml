name: Prepare Draw 1.1.1 Joomla 6-only

on:
  push:
    branches: [release/1.1.1-joomla6-only]
    paths:
      - '.github/workflows/prepare-1.1.1-joomla6.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.1-joomla6-only
      - name: Update version and Joomla 6-only metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          Path('VERSION').write_text('1.1.1\n', encoding='utf-8')

          p = Path('component/xdecarodraw.xml')
          t = p.read_text(encoding='utf-8').replace('<version>1.1.0</version>', '<version>1.1.1</version>', 1)
          if '<targetplatform name="joomla" version="6.*" />' not in t:
              t = t.replace('  <description>COM_XDECARODRAW_XML_DESCRIPTION</description>\n', '  <description>COM_XDECARODRAW_XML_DESCRIPTION</description>\n  <targetplatform name="joomla" version="6.*" />\n', 1)
          p.write_text(t, encoding='utf-8')

          p = Path('package/pkg_xdecarodraw.xml')
          t = p.read_text(encoding='utf-8').replace('<version>1.1.0</version>', '<version>1.1.1</version>', 1)
          if '<targetplatform name="joomla" version="6.*" />' not in t:
              t = t.replace('  <description>Server-side controlled draws, live reveal and audit for Joomla.</description>\n', '  <description>Server-side controlled draws, live reveal and audit for Joomla.</description>\n  <targetplatform name="joomla" version="6.*" />\n', 1)
          p.write_text(t, encoding='utf-8')

          p = Path('updates/pkg_xdecarodraw.xml')
          t = p.read_text(encoding='utf-8')
          t = t.replace('<version>1.1.0</version>', '<version>1.1.1</version>', 1)
          t = t.replace('/v1.1.0/pkg_xdecarodraw_1.1.0.zip', '/v1.1.1/pkg_xdecarodraw_1.1.1.zip', 1)
          import re
          t = re.sub(r'\s*<sha256>[^<]*</sha256>', '', t, count=1)
          t = t.replace('<targetplatform name="joomla" version="(4|5|6)\\.[0-9]+" />', '<targetplatform name="joomla" version="6\\.[0-9]+" />')
          t = t.replace('<php_minimum>8.1.0</php_minimum>', '<php_minimum>8.3.0</php_minimum>')
          p.write_text(t, encoding='utf-8')

          p = Path('component/media/joomla.asset.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['version'] = '1.1.1'
          p.write_text(json.dumps(data, separators=(',', ':')) + '\n', encoding='utf-8')

          p = Path('.github/workflows/build.yml')
          t = p.read_text(encoding='utf-8')
          t = t.replace("        php: ['8.1','8.3']", "        php: ['8.3']")
          old = """        joomla:\n          - {version: '4.4.14', php: '8.2', sha256: 'a1877816e070fa087529afcd73f214b7d5d76964d3ede0c3e6dfd354baad27b8'}\n          - {version: '5.4.8', php: '8.3', sha256: '8d3585939bca8e6b1d5f3e97dda2cc557c61e610daf488c871e1f62a97be9bd0'}\n          - {version: '6.1.3', php: '8.3', sha256: 'a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1'}\n"""
          new = """        joomla:\n          - {version: '6.1.3', php: '8.3', sha256: 'a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1'}\n"""
          if old not in t:
              raise SystemExit('Expected Joomla runtime matrix not found')
          t = t.replace(old, new, 1)
          validator = """          assert json.loads(pathlib.Path('component/media/joomla.asset.json').read_text())['version']==v\n          assert pathlib.Path(f'component/admin/sql/updates/mysql/{v}.sql').is_file()\n"""
          validator_new = validator + """          for manifest in ['component/xdecarodraw.xml','package/pkg_xdecarodraw.xml']:\n              root=ET.parse(manifest).getroot(); target=root.find('targetplatform'); assert target is not None and target.get('name')=='joomla' and target.get('version')=='6.*',(manifest,'must be Joomla 6 only')\n          update_target=ET.parse('updates/pkg_xdecarodraw.xml').getroot().find('./update/targetplatform'); assert update_target is not None and update_target.get('version')=='6\\.[0-9]+',('update feed','must be Joomla 6 only')\n"""
          if validator not in t:
              raise SystemExit('Expected metadata validator block not found')
          t = t.replace(validator, validator_new, 1)
          p.write_text(t, encoding='utf-8')

          p = Path('.github/workflows/release.yml')
          t = p.read_text(encoding='utf-8')
          t = t.replace('Joomla 4/5/6 compatibility is gated in CI.', 'Joomla 6.1.3 / PHP 8.3 compatibility is gated in CI; Joomla 4 and 5 are unsupported.')
          marker = """          assert json.loads(pathlib.Path('component/media/joomla.asset.json').read_text())['version']==v\n          assert pathlib.Path(f'component/admin/sql/updates/mysql/{v}.sql').is_file()\n"""
          marker_new = marker + """          for manifest in ['component/xdecarodraw.xml','package/pkg_xdecarodraw.xml']:\n              root=ET.parse(manifest).getroot(); target=root.find('targetplatform'); assert target is not None and target.get('name')=='joomla' and target.get('version')=='6.*',(manifest,'must be Joomla 6 only')\n          update_target=ET.parse('updates/pkg_xdecarodraw.xml').getroot().find('./update/targetplatform'); assert update_target is not None and update_target.get('version')=='6\\.[0-9]+',('update feed','must be Joomla 6 only')\n"""
          if marker not in t:
              raise SystemExit('Expected release validator block not found')
          t = t.replace(marker, marker_new, 1)
          p.write_text(t, encoding='utf-8')

          Path('component/admin/sql/updates/mysql/1.1.1.sql').write_text('-- Draw 1.1.1\n-- No database schema changes. Joomla 6-only compatibility metadata release.\n', encoding='utf-8')

          p = Path('CHANGELOG.md')
          t = p.read_text(encoding='utf-8')
          entry = '''## [1.1.1] - 2026-09-29\n\n### Changed\n- Draw now explicitly targets Joomla 6 only in the component manifest, package manifest and update server.\n- Removed Joomla 4.4 and Joomla 5.4 runtime jobs; CI now gates Joomla 6.1.3 with PHP 8.3.\n- Raised the update-server PHP baseline to 8.3.\n\n### Compatibility\n- Joomla 4 and Joomla 5 are not supported.\n- No database or Draw-engine behavior changes.\n\n'''
          if '## [1.1.1]' not in t:
              t = t.replace('All notable changes to Draw by xdecaro follow Semantic Versioning.\n\n', 'All notable changes to Draw by xdecaro follow Semantic Versioning.\n\n' + entry, 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION component package updates .github/workflows/build.yml .github/workflows/release.yml CHANGELOG.md
          git commit -m 'release: prepare Draw 1.1.1 Joomla 6 only'
          git push origin HEAD:release/1.1.1-joomla6-only
