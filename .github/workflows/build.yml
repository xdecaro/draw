name: Build Draw

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP and Core fallback
        run: |
          find component tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
      - name: Validate XML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          find component package updates -name '*.xml' -print0 | xargs -0 -n1 xmllint --noout
      - name: Guard boundaries schema and identity
        run: |
          test "$(cat VERSION)" = '0.2.0'
          test -f component/xdecarodraw.xml
          test -f package/pkg_xdecarodraw.xml
          grep -Fq 'xdecaro\Component\Draw' component/xdecarodraw.xml
          grep -Fq '#__xdecarodraw_' component/admin/sql/install.mysql.utf8mb4.sql
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
          ! grep -Rni '#__xdecarocompetitions_' component
          ! grep -RInE 'com_decarodraw|pkg_decarodraw|#__decarodraw_|Decarodraw' component package build tests updates README.md docs
          ! grep -RIn 'Xdecaro\\' component package build tests updates README.md docs
      - name: Deterministic build A
        run: bash build/build.sh && cp dist/SHA256SUMS.txt /tmp/draw-sums
      - name: Deterministic build B
        run: bash build/build.sh && diff -u /tmp/draw-sums dist/SHA256SUMS.txt && for file in dist/*.zip; do unzip -t "$file" >/dev/null; done
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: xdecarodraw-${{ github.sha }}
          path: dist/
