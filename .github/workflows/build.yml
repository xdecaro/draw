name: Draw CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, simplexml
          coverage: none
      - name: PHP syntax and domain tests
        run: |
          find component tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          php tests/draw-engine.php
          php tests/draw-integration-contract.php
          php tests/draw-integration-service.php
      - name: Validate metadata and boundaries
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 - <<'PY'
          import json,pathlib,xml.etree.ElementTree as ET
          v=pathlib.Path('VERSION').read_text().strip()
          for p in pathlib.Path('.').rglob('*.xml'): ET.parse(p)
          targets=['component/xdecarodraw.xml','package/pkg_xdecarodraw.xml','updates/pkg_xdecarodraw.xml']
          for p in targets:
              r=ET.parse(p).getroot(); n=r.find('version') if r.tag=='extension' else r.find('./update/version'); assert n is not None and n.text==v,(p,'version mismatch')
          assert json.loads(pathlib.Path('component/media/joomla.asset.json').read_text())['version']==v
          assert pathlib.Path(f'component/admin/sql/updates/mysql/{v}.sql').is_file()
          for manifest in ['component/xdecarodraw.xml','package/pkg_xdecarodraw.xml']:
              root=ET.parse(manifest).getroot(); target=root.find('targetplatform'); assert target is not None and target.get('name')=='joomla' and target.get('version')=='6.*',(manifest,'must be Joomla 6 only')
          update_target=ET.parse('updates/pkg_xdecarodraw.xml').getroot().find('./update/targetplatform'); assert update_target is not None and update_target.get('version')=='6\\.[0-9]+',('update feed','must be Joomla 6 only')
          PY
          grep -Fq 'charset="utf8"' component/xdecarodraw.xml
          ! grep -Fq 'charset="utf8mb4"' component/xdecarodraw.xml
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
          ! grep -Rni '#__xdecarocompetitions_' component
          ! grep -RniE 'Math\.random|crypto\.getRandomValues' component/media/js
          grep -Fq 'random_bytes(32)' component/admin/src/Service/DrawService.php
          grep -Fq 'CapabilityRegistry' component/admin/src/Service/CoreIntegrationService.php
          grep -Fq 'xdecaro.draw.result.v1' component/admin/src/Service/DrawReadService.php
          grep -Fq 'xdecaro.draw.request.v1' component/admin/src/Service/DrawIntegrationService.php
          grep -Fq 'COM_XDECARODRAW_DASHBOARD="Dashboard"' component/admin/language/en-GB/com_xdecarodraw.sys.ini
          grep -Fq 'COM_XDECARODRAW_INFORMATION="Information"' component/admin/language/en-GB/com_xdecarodraw.sys.ini
          grep -Fq 'COM_XDECARODRAW_DASHBOARD="Dashboard"' component/admin/language/it-IT/com_xdecarodraw.sys.ini
          grep -Fq 'COM_XDECARODRAW_INFORMATION="Informazioni"' component/admin/language/it-IT/com_xdecarodraw.sys.ini
          for table in draws entries targets assignments audit; do grep -Fq "CREATE TABLE IF NOT EXISTS \`#__xdecarodraw_${table}\`" component/admin/sql/updates/mysql/1.0.0.sql; done
      - name: Deterministic build
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          chmod +x build/build.sh
          build/build.sh
          cp dist/SHA256SUMS.txt /tmp/draw-sums
          build/build.sh
          diff -u /tmp/draw-sums dist/SHA256SUMS.txt
          for z in dist/*.zip; do unzip -t "$z" >/dev/null; done
          unzip -p "dist/com_xdecarodraw_${VERSION}.zip" xdecarodraw.xml | grep -F "<version>${VERSION}</version>"
          unzip -p "dist/com_xdecarodraw_${VERSION}.zip" xdecarodraw.xml | grep -F '<targetplatform name="joomla" version="6.*" />'
          unzip -l "dist/com_xdecarodraw_${VERSION}.zip" | grep -F 'admin/services/provider.php'
          unzip -l "dist/com_xdecarodraw_${VERSION}.zip" | grep -F 'admin/src/Service/DrawReadService.php'
          unzip -p "dist/com_xdecarodraw_${VERSION}.zip" admin/language/en-GB/com_xdecarodraw.sys.ini | grep -F 'COM_XDECARODRAW_DASHBOARD="Dashboard"'
          unzip -p "dist/com_xdecarodraw_${VERSION}.zip" admin/language/it-IT/com_xdecarodraw.sys.ini | grep -F 'COM_XDECARODRAW_INFORMATION="Informazioni"'
          unzip -l "dist/com_xdecarodraw_${VERSION}.zip" | grep -F 'site/src/View/Live/HtmlView.php'

  joomla-runtime:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        joomla:
          - {version: '6.1.3', php: '8.3', sha256: 'a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1'}
        mode: ['clean','repair-0.2.0']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: joomla
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.joomla.php }}
          extensions: mysqli, zip, simplexml
          coverage: none
      - name: Build Draw package
        run: chmod +x build/build.sh && build/build.sh
      - name: Download verified runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          J='${{ matrix.joomla.version }}'
          curl -fL --retry 3 "https://github.com/joomla/joomla-cms/releases/download/${J}/Joomla_${J}-Stable-Full_Package.zip" -o /tmp/joomla.zip
          echo '${{ matrix.joomla.sha256 }}  /tmp/joomla.zip' | sha256sum --check --strict
          curl -fL --retry 3 'https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip' -o /tmp/core.zip
          echo '4248f7e3de514c2ae2402ffc8ba12845647dca1ebac963da370650e88ac45def  /tmp/core.zip' | sha256sum --check --strict
          if [ '${{ matrix.mode }}' = 'repair-0.2.0' ]; then
            gh release download v0.2.0 --repo "$GITHUB_REPOSITORY" --pattern 'pkg_xdecarodraw_0.2.0.zip' --dir /tmp --clobber
            mv /tmp/pkg_xdecarodraw_0.2.0.zip /tmp/draw-old.zip
            echo '19a5700791e8340ed38d66a2c1773cb09dd500c2e75c7802879aa16d7e507920  /tmp/draw-old.zip' | sha256sum --check --strict
          fi
          mkdir joomla; unzip -q /tmp/joomla.zip -d joomla
      - name: Install Joomla, Core and Draw
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          cd joomla
          php installation/joomla.php install --site-name='Draw CI' --admin-user='Draw CI Admin' --admin-username=admin --admin-password="DrawCI-${GITHUB_RUN_ID}!" --admin-email=admin@example.invalid --db-type=mysqli --db-host=127.0.0.1 --db-user=root --db-pass='' --db-name=joomla --db-prefix=xdd_ --db-encryption=0 --no-interaction
          php cli/joomla.php extension:install --path=/tmp/core.zip -vvv
          if [ '${{ matrix.mode }}' = 'repair-0.2.0' ]; then php cli/joomla.php extension:install --path=/tmp/draw-old.zip -vvv; fi
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_xdecarodraw_${VERSION}.zip" -vvv
      - name: Verify repaired files and schema
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -f joomla/administrator/components/com_xdecarodraw/services/provider.php
          test -f joomla/administrator/components/com_xdecarodraw/src/Service/DrawReadService.php
          grep -Fq 'COM_XDECARODRAW_DASHBOARD="Dashboard"' joomla/administrator/components/com_xdecarodraw/language/en-GB/com_xdecarodraw.sys.ini
          grep -Fq 'COM_XDECARODRAW_INFORMATION="Informazioni"' joomla/administrator/components/com_xdecarodraw/language/it-IT/com_xdecarodraw.sys.ini
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM xdd_extensions WHERE type='package' AND element='pkg_xdecarodraw';")" = 1
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM xdd_extensions WHERE type='component' AND element='com_xdecarodraw';")" = 1
          for t in draws entries targets assignments audit; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='xdd_xdecarodraw_${t}';")" = 1; done
          schema="$("${MYSQL[@]}" -e "SELECT s.version_id FROM xdd_schemas s JOIN xdd_extensions e ON e.extension_id=s.extension_id WHERE e.type='component' AND e.element='com_xdecarodraw' LIMIT 1;")"
          test "$schema" = "$VERSION"
      - name: Exercise Draw runtime lifecycle
        run: DRAW_JOOMLA_ROOT="$GITHUB_WORKSPACE/joomla" php tests/runtime-probe.php
