name: Normalize Draw 0.2.0 Identity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/normalize-xdecaro-0.2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: normalize-xdecaro-0.2.0
          fetch-depth: 0
      - name: Normalize source identity
        run: python3 tools/normalize_identity.py
      - name: Validate transformed source
        run: |
          set -euo pipefail
          find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('.').rglob('*.xml'):
              if '.git' not in p.parts and '.github' not in p.parts:
                  ET.parse(p)
          PY
          test "$(cat VERSION)" = '0.2.0'
          test -f component/xdecarodraw.xml
          test -f package/pkg_xdecarodraw.xml
          grep -Fq 'xdecaro\Component\Draw' component/xdecarodraw.xml
          grep -Fq '#__xdecarodraw_' component/admin/sql/install.mysql.utf8mb4.sql
          ! grep -RIn 'Xdecaro\\' component package build tests updates README.md
          ! grep -RniE '#__(dcl|decarodcl|xdecarocompetitions)_' component --exclude-dir=.git
      - name: Commit transformed branch
        run: |
          set -euo pipefail
          rm tools/normalize_identity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize Draw 0.2.0 to lowercase xdecaro identity'
          git push origin HEAD:normalize-xdecaro-0.2.0
