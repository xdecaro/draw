name: Release Draw package

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, simplexml
          coverage: none
      - name: Read version
        run: echo "VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Refuse existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then echo "Release v${VERSION} already exists"; exit 1; fi
      - name: Validate release sources
        shell: bash
        run: |
          set -euo pipefail
          find component tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          php tests/draw-engine.php
          python3 - <<'PY'
          import json,pathlib,xml.etree.ElementTree as ET
          v=pathlib.Path('VERSION').read_text().strip()
          for p in ['component/xdecarodraw.xml','package/pkg_xdecarodraw.xml','updates/pkg_xdecarodraw.xml']:
              r=ET.parse(p).getroot(); n=r.find('version') if r.tag=='extension' else r.find('./update/version'); assert n is not None and n.text==v
          assert json.loads(pathlib.Path('component/media/joomla.asset.json').read_text())['version']==v
          PY
          grep -Fq 'charset="utf8"' component/xdecarodraw.xml
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
          ! grep -Rni '#__xdecarocompetitions_' component
      - name: Build deterministic packages
        run: |
          chmod +x build/build.sh; build/build.sh; cp dist/SHA256SUMS.txt /tmp/draw-sums; build/build.sh; diff -u /tmp/draw-sums dist/SHA256SUMS.txt
          for file in dist/*.zip; do unzip -t "$file" >/dev/null; done
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" "dist/com_xdecarodraw_${VERSION}.zip" "dist/pkg_xdecarodraw_${VERSION}.zip" "dist/SHA256SUMS.txt" --title "Draw by xdecaro ${VERSION}" --notes "Stable Draw 1.0: server-side deterministic assignment, validated constraints, immutable execution history, public live reveal, audit trail and optional Core 1.4 capabilities. Joomla 4/5/6 compatibility is gated in CI."
      - name: Publish package checksum
        run: |
          export PACKAGE_SHA="$(sha256sum "dist/pkg_xdecarodraw_${VERSION}.zip" | awk '{print $1}')"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          path=Path('updates/pkg_xdecarodraw.xml'); text=path.read_text()
          text=re.sub(r'\s*<sha256>[^<]*</sha256>','',text)
          text=text.replace('<targetplatform',f'<sha256>{os.environ["PACKAGE_SHA"]}</sha256>\n    <targetplatform',1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_xdecarodraw.xml
          git diff --cached --quiet || git commit -m "Publish SHA-256 for Draw ${VERSION}"
          git push
