name: Release Draw package

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Read version
        run: echo "VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Refuse existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
            exit 1
          fi
      - name: Validate sources and boundaries
        run: |
          find component tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          v = pathlib.Path('VERSION').read_text().strip()
          for p in ['component/xdecarodraw.xml','package/pkg_xdecarodraw.xml','updates/pkg_xdecarodraw.xml']:
              r = ET.parse(p).getroot()
              n = r.find('version') if r.tag == 'extension' else r.find('./update/version')
              assert n is not None and n.text == v, f'{p}: version mismatch'
          PY
          grep -Fq 'xdecaro\Component\Draw' component/xdecarodraw.xml
          grep -Fq '#__xdecarodraw_' component/admin/sql/install.mysql.utf8mb4.sql
          ! grep -Rni '#__xdecarocompetitions_' component
          ! grep -RIn 'Xdecaro\\' component package build tests updates README.md docs
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
      - name: Build deterministic packages
        run: |
          bash build/build.sh
          cp dist/SHA256SUMS.txt /tmp/draw-sums
          bash build/build.sh
          diff -u /tmp/draw-sums dist/SHA256SUMS.txt
          for file in dist/*.zip; do unzip -t "$file" >/dev/null; done
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            "dist/com_xdecarodraw_${VERSION}.zip" \
            "dist/pkg_xdecarodraw_${VERSION}.zip" \
            "dist/SHA256SUMS.txt" \
            --prerelease \
            --title "Draw by xdecaro ${VERSION}" \
            --notes "Fresh prerelease technical baseline using com_xdecarodraw, pkg_xdecarodraw, xdecaro\\Component\\Draw and #__xdecarodraw_*. Draw remains independent from Competitions private tables."
      - name: Publish package checksum
        run: |
          export PACKAGE_SHA="$(sha256sum "dist/pkg_xdecarodraw_${VERSION}.zip" | awk '{print $1}')"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('updates/pkg_xdecarodraw.xml')
          text = path.read_text()
          text = re.sub(r'<sha256>[^<]*</sha256>', '', text)
          text = text.replace('<targetplatform', f'<sha256>{os.environ["PACKAGE_SHA"]}</sha256><targetplatform', 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_xdecarodraw.xml
          git diff --cached --quiet || git commit -m "Publish SHA-256 for Draw ${VERSION}"
          git push
